<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Multimodal fusion architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, Menlo, Monaco, monospace; }
      .m1 { fill: rgba(88,166,255,0.08); stroke: rgba(88,166,255,0.32); stroke-width:1.5; }
      .m2 { fill: rgba(63,185,80,0.08); stroke: rgba(63,185,80,0.34); stroke-width:1.5; }
      .m3 { fill: rgba(248,81,73,0.08); stroke: rgba(248,81,73,0.34); stroke-width:1.5; }
      .fuse { fill: rgba(155,92,255,0.10); stroke: rgba(155,92,255,0.36); stroke-width:1.5; }
      .t { fill:#e6edf3; } .d { fill:#8b949e; }
    </style>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <text x="24" y="38" class="sans" font-size="18" font-weight="700" fill="#e6edf3">Three modalities → PCA compression → late fusion → explainable risk score</text>

  <!-- modality inputs -->
  <rect class="m1" x="24" y="66"  width="250" height="60" rx="10"/>
  <text x="40" y="92" class="sans t" font-size="15" font-weight="700">Structured (labs, vitals, meds)</text>
  <text x="40" y="114" class="mono d" font-size="12">179 features</text>

  <rect class="m2" x="24" y="146" width="250" height="60" rx="10"/>
  <text x="40" y="172" class="sans t" font-size="15" font-weight="700">Radiology notes → ClinicalBERT</text>
  <text x="40" y="194" class="mono d" font-size="12">PCA → 20 dims (70% var)</text>

  <rect class="m3" x="24" y="226" width="250" height="60" rx="10"/>
  <text x="40" y="252" class="sans t" font-size="15" font-weight="700">Chest X-ray → BioViL</text>
  <text x="40" y="274" class="mono d" font-size="12">PCA → 20 dims (98% var)</text>

  <!-- fusion -->
  <rect class="fuse" x="470" y="116" width="220" height="120" rx="12"/>
  <text x="486" y="150" class="sans t" font-size="16" font-weight="700">Feature fusion</text>
  <text x="486" y="178" class="mono d" font-size="12.5">219-d fused vector</text>
  <text x="486" y="200" class="mono d" font-size="12.5">standardize + PCA</text>
  <text x="486" y="222" class="mono d" font-size="12.5">Logistic Regression</text>

  <!-- output -->
  <rect class="m3" x="760" y="116" width="200" height="120" rx="12"/>
  <text x="776" y="150" class="sans t" font-size="16" font-weight="700">Risk score</text>
  <text x="776" y="178" class="mono d" font-size="12.5">respiratory failure</text>
  <text x="776" y="200" class="mono" font-size="13" fill="#3fb950">Test AUROC 0.855</text>
  <text x="776" y="222" class="mono" font-size="13" fill="#3fb950">Test AUPRC 0.856</text>

  <!-- explain -->
  <rect class="m1" x="1000" y="116" width="176" height="120" rx="12"/>
  <text x="1016" y="150" class="sans t" font-size="16" font-weight="700">SHAP</text>
  <text x="1016" y="178" class="mono d" font-size="12.5">per-feature</text>
  <text x="1016" y="200" class="mono d" font-size="12.5">attribution in a</text>
  <text x="1016" y="222" class="mono d" font-size="12.5">Streamlit app</text>

  <g stroke="#58a6ff" stroke-width="2" marker-end="url(#arw)">
    <line x1="274" y1="96"  x2="466" y2="150"/>
    <line x1="274" y1="176" x2="466" y2="176"/>
    <line x1="274" y1="256" x2="466" y2="202"/>
    <line x1="692" y1="176" x2="756" y2="176" stroke="#f85149"/>
    <line x1="962" y1="176" x2="998" y2="176"/>
  </g>
</svg>
